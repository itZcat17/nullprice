appId: com.nullprice.store
productName: Nullprice
copyright: Nullprice

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

# The catalogue ships beside the binary rather than inside the asar, so it can be
# replaced without rebuilding the app.
extraResources:
  - from: catalogue.json
    to: catalogue.json

# The store updates itself through its own GitHub releases, exactly like the tools it
# installs. Replace owner before the first publish; electron-updater reads this to build
# the latest.yml feed URL.
publish:
  - provider: github
    owner: REPLACE-ME
    repo: nullprice
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nullprice
